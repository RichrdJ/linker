<!doctype html>
<html lang="nl" data-theme="{{ s.theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#141a22">
<meta name="robots" content="noindex, nofollow">
<title>Inloggen · {{ s.title }}</title>
<link rel="icon" href="/favicon.svg?c={{ s.accent[1:] }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png?c={{ s.accent[1:] }}">
<link rel="manifest" href="/manifest.webmanifest?c={{ s.accent[1:] }}">
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
<style>
  :root { --accent: {{ s.accent }}; --accent-ink: {{ accent_ink }}; }
  body { min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
         background: radial-gradient(900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), var(--bg); }
  .login { width: min(380px, 100%); padding: 32px 28px 26px; background: var(--surface); border: 1px solid var(--line);
           border-radius: var(--radius-lg); box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .55); animation: rise .2s ease-out; }
  .login .logo-mark { width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 16px; }
  .login h1 { margin: 0; text-align: center; font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
  .login .lead { margin: 6px 0 24px; text-align: center; color: var(--muted); font-size: 14px; }
  .login label.field { display: block; font-size: 13px; color: var(--muted); }
  .login input[type=password] { display: block; width: 100%; height: 44px; margin-top: 6px; padding: 0 12px;
           background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); color: var(--fg); font-size: 16px; }
  .login input[type=password]:focus { outline: none; border-color: var(--accent);
           box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .login .remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 20px; font-size: 14px; cursor: pointer; }
  .login .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .login .btn.primary { width: 100%; height: 44px; font-size: 15px; }
  .login .error { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 18px; padding: 10px 12px; font-size: 14px;
           color: var(--fg); background: color-mix(in srgb, var(--down) 14%, transparent);
           border: 1px solid color-mix(in srgb, var(--down) 45%, transparent); border-radius: var(--radius); }
  .login .error::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: var(--down); }
  .login-foot { margin: 18px 0 0; text-align: center; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<main class="login">
  <span class="logo-mark" aria-hidden="true" style="display:block"></span>
  <h1>{{ s.title }}</h1>
  <p class="lead">Log in om je startpagina te openen.</p>

  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    {# Voor wachtwoordmanagers: die willen een gebruikersnaam bij het wachtwoord #}
    <input type="text" name="username" value="linker" autocomplete="username" hidden>
    <label class="field">Wachtwoord
      <input type="password" name="password" required autofocus autocomplete="current-password" maxlength="200">
    </label>
    <label class="remember"><input type="checkbox" name="remember" value="1" checked> Ingelogd blijven op dit apparaat</label>
    <button type="submit" class="btn primary">Inloggen</button>
  </form>
  <p class="login-foot">Zonder vinkje word je na 12 uur uitgelogd, met vinkje na 30 dagen.</p>
</main>
</body>
</html>
